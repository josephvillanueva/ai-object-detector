version: 2.1
jobs:
  check:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - checkout
      - run: npm ci
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Build
          command: npm run build
workflows:
  ci:
    jobs:
      - check
