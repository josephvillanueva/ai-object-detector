version: 2.1

parameters:
  force_full:
    type: boolean
    default: false
jobs:
  check:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - checkout
      - run:
          name: Check whether full verification is needed
          environment:
            CI_DEFAULT_BRANCH: "master"
            CI_BASE_REVISION: << pipeline.git.base_revision >>
            CI_FORCE_FULL: << pipeline.parameters.force_full >>
          command: bash .circleci/should-run.sh
      - run: npm ci
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Build
          command: npm run build
workflows:
  ci:
    when:
      or:
        - << pipeline.parameters.force_full >>
        - not:
            equal: ["master", << pipeline.git.branch >>]
    jobs:
      - check
