<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 668" width="1160" height="668" role="img" aria-labelledby="t"><title id="t">AI Object Detector architecture</title><style>svg{--bg:#ffffff;--zone:#f5f6f8;--zoneStroke:#d5d9e0;--zoneLabel:#0a6fb8;--node:#ffffff;--nodeStroke:#c4cad3;--title:#111827;--text:#4b5563;--edge:#6b7280;--edgeText:#374151;--accent:#0a84d6;--pill:#ffffff;}@media (prefers-color-scheme: dark){svg{--bg:#0f1218;--zone:#151a23;--zoneStroke:#2a313d;--zoneLabel:#4db5ff;--node:#1b212c;--nodeStroke:#363e4c;--title:#f3f4f6;--text:#a4acb9;--edge:#8a93a2;--edgeText:#d1d5db;--accent:#4db5ff;--pill:#0f1218;}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.zone{fill:var(--zone);stroke:var(--zoneStroke);stroke-width:1;stroke-dasharray:5 4}
.zlabel{fill:var(--zoneLabel);font-size:12px;font-weight:700;letter-spacing:.08em}
.zsub{fill:var(--text);font-size:12px}
.node{fill:var(--node);stroke:var(--nodeStroke);stroke-width:1.2}
.node.key{stroke:var(--accent);stroke-width:2}
.bar{fill:var(--accent)}
.ntitle{fill:var(--title);font-size:14px;font-weight:600}
.ntext{fill:var(--text);font-size:12px}
.edge{fill:none;stroke:var(--edge);stroke-width:1.5}
.edge.alt{stroke-dasharray:6 4}
.head{fill:var(--edge)}
.pill{fill:var(--pill);stroke:var(--zoneStroke);stroke-width:1}
.elabel{fill:var(--edgeText);font-size:11.5px}
.legend{fill:var(--text);font-size:12px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" width="1160" height="668" rx="14"/><rect class="zone" x="16" y="16" width="1128" height="400" rx="12"/><text class="zlabel" x="36" y="46">BROWSER</text><text class="zsub" x="36" y="66">Everything here runs on the visitor's device. Video frames are never uploaded.</text><rect class="zone" x="16" y="440" width="1128" height="180" rx="12"/><text class="zlabel" x="36" y="470">NETWORK</text><text class="zsub" x="36" y="490">Only static files are downloaded. No API is called.</text><path class="edge" d="M288,155.5 L388,155.5" marker-end="url(#arrow)"/><path class="edge" d="M648,155.5 L748,155.5" marker-end="url(#arrow)"/><path class="edge" d="M479,201 L479,300" marker-end="url(#arrow)"/><path class="edge" d="M609,201 L609,240 Q609,250 619,250 L858,250 Q868,250 868,260 L868,300" marker-end="url(#arrow)"/><path class="edge" d="M518,374 L518,520" marker-end="url(#arrow)"/><rect class="node" x="48" y="110" width="240" height="91" rx="10"/><text class="ntitle" x="64" y="137">Webcam</text><text class="ntext" x="64" y="158">react-webcam (getUserMedia)</text><text class="ntext" x="64" y="175">Stage takes the camera's</text><text class="ntext" x="64" y="192">own aspect ratio</text><rect class="node key" x="388" y="110" width="260" height="91" rx="10"/><text class="ntitle" x="404" y="137">Detection loop</text><text class="ntext" x="404" y="158">One requestAnimationFrame per</text><text class="ntext" x="404" y="175">detection, never overlapping</text><text class="ntext" x="404" y="192">Confidence threshold 0.6</text><rect class="node" x="748" y="110" width="240" height="91" rx="10"/><text class="ntitle" x="764" y="137">Canvas overlay</text><text class="ntext" x="764" y="158">Boxes and labels drawn at</text><text class="ntext" x="764" y="175">the video's native resolution,</text><text class="ntext" x="764" y="192">so they line up at any size</text><rect class="node" x="388" y="300" width="260" height="74" rx="10"/><text class="ntitle" x="404" y="327">TensorFlow.js + COCO-SSD</text><text class="ntext" x="404" y="348">WebGL backend, CPU fallback</text><text class="ntext" x="404" y="365">80 object classes</text><rect class="node" x="748" y="300" width="240" height="91" rx="10"/><text class="ntitle" x="764" y="327">Detected panel</text><text class="ntext" x="764" y="348">Grouped by class</text><text class="ntext" x="764" y="365">Re-renders only on change</text><text class="ntext" x="764" y="382">Live FPS readout</text><rect class="node" x="388" y="520" width="260" height="74" rx="10"/><text class="ntitle" x="404" y="547">Google Cloud Storage</text><text class="ntext" x="404" y="568">COCO-SSD lite_mobilenet_v2</text><text class="ntext" x="404" y="585">model weights</text><rect class="node" x="748" y="520" width="240" height="74" rx="10"/><text class="ntitle" x="764" y="547">Vercel</text><text class="ntext" x="764" y="568">Serves the static Next.js page</text><text class="ntext" x="764" y="585">No server code runs</text><rect class="pill" x="312.68" y="145.5" width="50.64" height="20" rx="5"/><text class="elabel" x="338" y="159.5" text-anchor="middle">frames</text><rect class="pill" x="675.9" y="145.5" width="44.2" height="20" rx="5"/><text class="elabel" x="698" y="159.5" text-anchor="middle">boxes</text><rect class="pill" x="431.14" y="240.5" width="95.72000000000001" height="20" rx="5"/><text class="elabel" x="479" y="254.5" text-anchor="middle">detect(video)</text><rect class="pill" x="709.96" y="240" width="57.080000000000005" height="20" rx="5"/><text class="elabel" x="738.5" y="254" text-anchor="middle">summary</text><rect class="pill" x="473.36" y="430" width="89.28" height="34" rx="5"/><text class="elabel" x="518" y="444" text-anchor="middle">downloaded</text><text class="elabel" x="518" y="458" text-anchor="middle">once on load</text><path class="edge" d="M36,642 L70,642" marker-end="url(#arrow)"/><text class="legend" x="80" y="646">Data flow</text><rect class="node key" x="170.48000000000002" y="634" width="22" height="16" rx="4"/><text class="legend" x="200.48000000000002" y="646">Core logic</text></svg>
